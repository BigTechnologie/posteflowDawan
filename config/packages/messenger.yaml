framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Nous ajouterons ColisLivreMessage au Ticket suivant => décommenter si la classe existe. 
            App\Message\ColisLivreMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'